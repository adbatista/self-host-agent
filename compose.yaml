services:
  agent:
    build:
      context: .
      args:
        # Agent release tag; "latest" = newest stable release at build time.
        # Override: AGENT_VERSION=v2.4.0 docker compose build  (or set it in .env)
        AGENT_VERSION: ${AGENT_VERSION:-latest}
    image: semaphore-agent:local
    env_file: .env
    restart: unless-stopped
    init: true
    # Let a running job finish before the container is killed on `compose down`/`stop`.
    stop_grace_period: 2m
