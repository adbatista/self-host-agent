services:
  agent:
    build:
      context: .
      args:
        # Agent git ref (tag, branch or SHA); "latest" = newest tag (rc included).
        # Override: AGENT_VERSION=v2.4.0 docker compose build  (or set it in .env)
        AGENT_VERSION: ${AGENT_VERSION:-latest}
        # Agent binary origin: "source" (compile the ref) or "release" (prebuilt
        # GitHub release asset, tags only).
        AGENT_SOURCE: ${AGENT_SOURCE:-source}
    image: semaphore-agent:local
    # Resolved from ./.env by default, from `--env-file <file>` or the shell when
    # given, so one checkout can run several agents: `docker compose -p a --env-file .env.a up`.
    environment:
      - SEMAPHORE_AGENT_ENDPOINT
      - SEMAPHORE_AGENT_TOKEN
      - SEMAPHORE_AGENT_NAME
      - SEMAPHORE_AGENT_DISCONNECT_AFTER_JOB
      - SEMAPHORE_AGENT_DISCONNECT_AFTER_IDLE_TIMEOUT
      - SEMAPHORE_AGENT_UPLOAD_JOB_LOGS
      - SEMAPHORE_AGENT_INTERRUPTION_GRACE_PERIOD
      - SEMAPHORE_AGENT_SHUTDOWN_HOOK_PATH
      - SEMAPHORE_AGENT_PRE_JOB_HOOK_PATH
      - SEMAPHORE_AGENT_FAIL_ON_PRE_JOB_HOOK_ERROR
      - SEMAPHORE_AGENT_ENV_VARS
      - SEMAPHORE_AGENT_FILES
      - SEMAPHORE_AGENT_FAIL_ON_MISSING_FILES
    restart: unless-stopped
    init: true
    # Let a running job finish before the container is killed on `compose down`/`stop`.
    stop_grace_period: 2m
